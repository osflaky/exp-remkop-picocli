name: Build
on:
  workflow_dispatch:
permissions:
  checks: write
  pull-requests: write

  contents: read
jobs:
  build-java-8-plus:
    strategy:
      fail-fast: false
      matrix:
        include:
        - java-version: 25
          os: ubuntu-latest
          arch: x64
          runner: ubuntu-latest
          expander_leg: ubuntu-latest-25-x64
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.os == 'macos-latest' || matrix.java-version ==
      '9' || matrix.java-version == '18' || matrix.java-version == '19' || 
      matrix.java-version == '20' || matrix.java-version == '22' || 
      matrix.java-version == '23' || matrix.java-version == '24' }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Validate Gradle Wrapper
      uses: 
        gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6

      # The Gradle wrapper (8.14) cannot run on Java 25+ ("Unsupported class file major version 69").
      # For those versions, Gradle itself runs on JDK 21 while the tests still run on the matrix JDK.
    - name: Configure JDK 21 to run Gradle
      id: gradle-jdk
      if: ${{ matrix.java-version >= 25 }}
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Configure JDK ${{ matrix.java-version }}
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java-version }}
        cache: gradle

    - name: Run Gradle on JDK 21, tests on JDK ${{ matrix.java-version }}
      if: ${{ matrix.java-version >= 25 }}
      shell: bash
      run: |
        mkdir -p ~/.gradle/init.d
        cat > ~/.gradle/init.d/test-jvm.gradle <<'EOF'
        def testJavaHome = System.getenv('TEST_JAVA_HOME')
        if (testJavaHome) {
            def exe = System.getProperty('os.name').toLowerCase().contains('windows') ? 'java.exe' : 'java'
            allprojects {
                tasks.withType(Test).configureEach {
                    executable = new File(new File(testJavaHome, 'bin'), exe).absolutePath
                }
            }
        }
        EOF
        echo "TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
        echo "JAVA_HOME=${{ steps.gradle-jdk.outputs.path }}" >> "$GITHUB_ENV"

    - name: Show Gradle Version
      run: ./gradlew --version

    - name: ShowToolChains
      run: ./gradlew -q javaToolchains

    - name: Build
      run: ./gradlew --stop;./gradlew clean;./gradlew build --no-daemon

    - name: Publish Test Results (Linux)
      uses: EnricoMi/publish-unit-test-result-action@v2
      id: test-results-nix
      if: ${{ always() && matrix.os == 'ubuntu-latest' }}
      with:
        files: |
          build/test-results/test/**/*.xml
          picocli-*/build/test-results/test/**/*.xml

    - name: Publish Test Results (Win/Mac)
      uses: EnricoMi/publish-unit-test-result-action/composite@v2
      id: test-results
      if: ${{ always() && (matrix.os == 'macos-latest' || matrix.os == 
        'windows-latest') }}
      with:
        files: |
          build/test-results/test/**/*.xml
          picocli-*/build/test-results/test/**/*.xml

    - name: Set badge color (Linux)
      shell: bash
      if: ${{ always() && matrix.os == 'ubuntu-latest' && 
        steps.test-results-nix.outputs.json }}
      run: |
        case ${{ fromJSON( steps.test-results-nix.outputs.json ).conclusion }} in
          success)
            echo "BADGE_COLOR=31c653" >> $GITHUB_ENV
            ;;
          failure)
            echo "BADGE_COLOR=800000" >> $GITHUB_ENV
            ;;
          neutral)
            echo "BADGE_COLOR=696969" >> $GITHUB_ENV
            ;;
        esac

    - name: Set badge color (Win/Mac)
      shell: bash
      if: ${{ always() && (matrix.os == 'macos-latest' || matrix.os == 
        'windows-latest') && steps.test-results.outputs.json }}
      run: |
        case ${{ fromJSON( steps.test-results.outputs.json ).conclusion }} in
          success)
            echo "BADGE_COLOR=31c653" >> $GITHUB_ENV
            ;;
          failure)
            echo "BADGE_COLOR=800000" >> $GITHUB_ENV
            ;;
          neutral)
            echo "BADGE_COLOR=696969" >> $GITHUB_ENV
            ;;
        esac

    - name: Create badge (Linux)
      if: ${{ always() && matrix.os == 'ubuntu-latest' && 
        steps.test-results-nix.outputs.json }}
      uses: emibcn/badge-action@808173dd03e2f30c980d03ee49e181626088eee8
      with:
        label: Tests
        status: '${{ fromJSON( steps.test-results-nix.outputs.json ).formatted.stats.tests
          }} tests, ${{ fromJSON( steps.test-results-nix.outputs.json ).formatted.stats.runs
          }} runs: ${{ fromJSON( steps.test-results-nix.outputs.json ).conclusion
          }}'
        color: ${{ env.BADGE_COLOR }}
        path: badge.svg

    - name: Create badge (Win/Mac)
      if: ${{ always() && (matrix.os == 'macos-latest' || matrix.os == 
        'windows-latest') && steps.test-results.outputs.json }}
      uses: emibcn/badge-action@808173dd03e2f30c980d03ee49e181626088eee8
      with:
        label: Tests
        status: '${{ fromJSON( steps.test-results.outputs.json ).formatted.stats.tests
          }} tests, ${{ fromJSON( steps.test-results.outputs.json ).formatted.stats.runs
          }} runs: ${{ fromJSON( steps.test-results.outputs.json ).conclusion }}'
        color: ${{ env.BADGE_COLOR }}
        path: badge.svg

    - name: Upload badge to Gist
        # Upload only for main branch
      if: >
        github.event_name == 'workflow_run' && github.event.workflow_run.head_branch
        == 'main' ||
        github.event_name != 'workflow_run' && github.ref == 'refs/heads/main'
      uses: 
        andymckay/append-gist-action@ab30bf28df67017c7ad696500b218558c7c04db3
      with:
        token: ${{ secrets.GIST_TOKEN }}
        gistURL: 
          https://gist.githubusercontent.com/remkop/36bc8a3b4395f2fbdb9bc271e97ba2dd
        file: badge.svg


    name: build-java-8-plus [${{ matrix.expander_leg }}]
    timeout-minutes: 150
